<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fffbed">
  <title>Reset password | MELIO</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap"
    rel="stylesheet">

  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body class="auth-page auth-page--reset">
  <main class="auth-layout">
    <aside class="auth-journal" aria-label="MELIO study journal">
      <span class="auth-journal__label">A fresh page awaits</span>
      <img class="auth-journal__logo" src="assets/images/logo1.png" alt="MELIO">
      <h2 class="auth-journal__title">Little steps.<br>Big dreams.</h2>
      <p class="auth-journal__copy">A cozy little corner for your next bright idea.</p>
      <div class="auth-journal__pet" aria-hidden="true">
        <img src="assets/images/pet/dashboard pet.png" alt="">
      </div>
      <p class="auth-journal__note">Today is a good day to begin</p>
    </aside>

    <section class="auth-container" aria-labelledby="reset-title">
      <div class="card card--taped auth-card">
        <header class="auth-header">
          <p class="auth-eyebrow">Your study journal · 01</p>
        </header>

        <h1 class="auth-title" id="reset-title">Reset your password</h1>
        <p class="text-soft auth-subtitle">Enter your email address and we’ll send you a link to reset your password.</p>

        <div id="form-error" class="alert alert-error" role="alert" hidden></div>
        <div id="form-success" class="alert alert-success" role="status" hidden></div>

        <form id="reset-password-form" method="post">
          <div class="form-group">
            <label class="form-label" for="reset-email">Email address</label>
            <input class="form-input" type="email" id="reset-email" name="email"
              placeholder="you@example.com" autocomplete="email" required>
            <p class="field-error" id="email-error"></p>
          </div>

          <button class="btn btn-primary btn-block" type="submit">Reset</button>
        </form>

        <p class="auth-switch"><a href="login.html">Back to login</a></p>
      </div>
    </section>
  </main>
</body>
</html>
