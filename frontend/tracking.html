<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fffbed">
  <title>Study Tracking | MELIO</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/pages/tracking.css">
</head>
<body>
  <div id="app-root" aria-busy="true">
    <div class="app-loading" role="status">Gathering your study progress…</div>
  </div>

  <template id="tracking-template">
    <div class="tracking-page">
      <header class="tracking-heading">
        <div>
          <p class="page-heading__eyebrow">Main / Your progress</p>
          <h1>Study Tracking</h1>
        </div>
        <a class="btn btn-primary" href="pomodoro.html">◷ Study now</a>
      </header>

      <section class="tracking-controls" aria-label="Study tracking controls">
        <div class="tracking-period" role="group" aria-label="Select reporting period">
          <button class="tracking-period__button" type="button" data-period="7" aria-pressed="true">7 days</button>
          <button class="tracking-period__button" type="button" data-period="30" aria-pressed="false">30 days</button>
        </div>
        <label class="tracking-subject">
          <span class="visually-hidden">Filter by subject</span>
          <select class="form-select" data-subject-filter>
            <option value="all">All subjects</option>
            <option>Programming</option>
            <option>Mathematics</option>
            <option>English</option>
            <option>Database Systems</option>
            <option>Computer Networks</option>
            <option>Other</option>
          </select>
        </label>
      </section>

      <section class="tracking-stats" aria-label="Study summary">
        <article class="tracking-stat">
          <span class="tracking-stat__label">◷ Study time</span>
          <strong class="tracking-stat__value" data-total-time>0 min</strong>
        </article>
        <article class="tracking-stat">
          <span class="tracking-stat__label">✦ Focus sessions</span>
          <strong class="tracking-stat__value" data-session-total>0</strong>
        </article>
        <article class="tracking-stat">
          <span class="tracking-stat__label">♨ Active days</span>
          <strong class="tracking-stat__value" data-active-days>0</strong>
        </article>
        <form class="tracking-goal" data-goal-form>
          <label class="tracking-stat__label" for="daily-study-goal">▥ Daily goal</label>
          <div class="tracking-goal__controls">
            <input class="tracking-goal__input" id="daily-study-goal" name="dailyGoal" type="number" min="5" max="720" step="5" required>
            <span>min</span>
            <button type="submit" class="tracking-goal__save">Save</button>
          </div>
          <span class="visually-hidden" data-goal-feedback role="status" aria-live="polite"></span>
        </form>
      </section>

      <section class="tracking-chart card" aria-labelledby="activity-title">
        <header class="tracking-section-heading">
          <div>
            <p class="page-heading__eyebrow">A gentle look back</p>
            <h2 id="activity-title">One day at a time</h2>
          </div>
          <span class="tracking-chart__caption">Daily totals · UTC</span>
        </header>
        <ol class="activity-chart" data-activity-chart aria-label="Daily study time"></ol>
        <p class="tracking-empty" data-chart-empty hidden>No study time recorded in this period yet.</p>
      </section>

      <div class="tracking-details">
        <section class="subject-breakdown card" aria-labelledby="subject-breakdown-title">
          <header class="tracking-section-heading">
            <div>
              <p class="page-heading__eyebrow">Little by little</p>
              <h2 id="subject-breakdown-title">By subject</h2>
            </div>
            <span class="subject-breakdown__flower" aria-hidden="true">✿</span>
          </header>
          <ul class="subject-list" data-subject-list></ul>
          <p class="tracking-empty" data-subject-empty hidden>No subject time in this period.</p>
        </section>

        <section class="session-journal card" aria-labelledby="session-journal-title">
          <header class="tracking-section-heading">
            <div>
              <p class="page-heading__eyebrow">Every small win</p>
              <h2 id="session-journal-title">Session journal</h2>
            </div>
            <span class="session-journal__sparkle" aria-hidden="true">✦</span>
          </header>
          <ol class="tracking-session-list" data-session-list></ol>
          <p class="tracking-empty" data-session-empty hidden>No sessions in this period. Start a focus timer to add one.</p>
        </section>
      </div>
    </div>
  </template>

  <script type="module" src="js/pages/tracking.js"></script>
</body>
</html>
