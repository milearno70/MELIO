<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MELIO Component Preview</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages/preview.css">
</head>
<body class="preview-page">
  <main class="preview-card card card--taped">
    <h1 class="logo text-center">MELIO</h1>
    <p class="slogan text-center">Little Steps, Big Dreams.</p>

    <div class="preview-label">Component swatches · 01</div>
    <div class="alert alert-success" role="status">Your little win was saved.</div>
    <div class="alert alert-error" role="alert">This is an example error message.</div>

    <div class="form-group">
      <label class="form-label" for="email">Email</label>
      <input class="form-input" id="email" type="email" placeholder="you@example.com">
    </div>

    <div class="form-group">
      <label class="form-label" for="password">Password</label>
      <div class="input-wrap">
        <input class="form-input is-invalid" id="password" type="password" placeholder="Your password">
        <button class="toggle-password" type="button" aria-label="Show password">👁</button>
      </div>
      <p class="field-error">Use at least 8 characters.</p>
    </div>

    <button class="btn btn-primary btn-block" type="button">Save this page</button>
  </main>
</body>
</html>
