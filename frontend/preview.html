<!DOCTYPE html>
<html lang="az">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MELIO Design Preview</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <main style="max-width: 420px; margin: 3rem auto; padding: 0 1rem;">
        <div class="card card--taped">
            <h1 class="logo text-center">MELIO</h1>
            <p class="slogan text-center">Little Steps, Big Dreams.</p>

            <div class="alert alert-success">Uğurlu mesaj nümunəsi</div>
            <div class="alert alert-error">Xəta mesajı nümunəsi</div>

            <div class="form-group">
                <label class="form-label" for="email">Email</label>
                <input class="form-input" id="email" type="email" placeholder="sen@email.com">
            </div>

            <div class="form-group">
                <label class="form-label" for="pw">Password</label>
                <div class="input-wrap">
                    <input class="form-input is-invalid" id="pw" type="password" placeholder="••••••••">
                    <button class="toggle-password" type="button">👁</button>
                </div>
                <p class="field-error">Password ən azı 8 simvol olmalıdır</p>
            </div>

            <button class="btn btn-primary btn-block" type="button">Test Button</button>
        </div>
    </main>
</body>

</html>
